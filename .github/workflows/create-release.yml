name: Create Atlantis release

on:
  push:
    tags:
      - "v*"

jobs:
  get-atlantis-versions:
    name: Set Atlantis versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          VERSIONS=$(curl -s https://api.github.com/repos/runatlantis/atlantis/releases\?per_page\=100 | jq -r '[.[].tag_name]  | map(capture("^v(?<major>0|[1-9]\\d*)\\.(?<minor>0|[1-9]\\d*)\\.(?<patch>0|[1-9]\\d*)")) | map({version: "\(.major).\(.minor).\(.patch)", group: "\(.major).\(.minor)", major: .major | tonumber, minor: .minor | tonumber, patch:  .patch | tonumber}) | group_by(.group) | map (.[0]) | sort_by(.major, .minor, .patch) | reverse | .[:2] | . as $result | map({version, group, latest: (.version == $result[0].version)}) | {include: .} | tostring')
          echo "::set-output name=matrix::${VERSIONS}"
  build:
    name: Create release assets
    needs: get-atlantis-versions
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{fromJson(needs.get-atlantis-versions.outputs.matrix)}}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v3
        with:
          images: infracost/atlantis-test
          flavor: |
            latest=${{ matrix.latest }}
            prefix=atlantis${{ matrix.group }}-infracost,onlatest=false
          tags: |
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            atlantis-version=${{ matrix.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            version=v${{ matrix.version }}
          push: true
